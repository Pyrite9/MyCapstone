<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light only">
<title>캡스톤디자인 주제 제안 — 유가이력 · 책바퀴 · 잇썸</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@400;500;700;900&display=swap" rel="stylesheet">
<style>
  :root{
    color-scheme: light only;
    --base:#EDE9E3;
    --band:#E1DBD2;
    --primary:#332C4A;
    --secondary:#9C8B72;
    --accent:#B8863B;
    --text:#211D2B;
    --text-sub:#4E4760;
    --line:#CFC7BA;
    --sans:'Noto Sans KR', 'Apple SD Gothic Neo', 'Malgun Gothic', sans-serif;
  }
  *{ box-sizing:border-box; }
  html,body{ margin:0; height:100%; overflow:hidden; background:var(--base); color:var(--text); font-family:var(--sans); }
  body{ display:flex; align-items:center; justify-content:center; word-break:keep-all; overflow-wrap:break-word; }

  #stage{ position:relative; width:min(100vw,177.78vh); height:min(100vh,56.25vw); overflow:hidden; container-type:size; }
  #deck{ position:relative; width:100%; height:100%; }

  .slide{
    position:absolute; inset:0; display:flex; flex-direction:column;
    padding:5.2cqh 5.5cqw 8.5cqh; background:var(--base);
    opacity:0; visibility:hidden; transform:translateY(5%);
    transition:opacity .5s cubic-bezier(.4,0,.2,1), transform .5s cubic-bezier(.4,0,.2,1);
  }
  .slide.active{ opacity:1; visibility:visible; transform:translateY(0); }
  .slide.prev{ transform:translateY(-5%); }
  .slide.inv{ background:var(--primary); color:var(--base); }

  /* 타이포 — 최솟값은 프로젝터 하한 */
  .h1{ font-size:clamp(68px,6.1cqw,120px); font-weight:900; line-height:1.24; letter-spacing:-0.015em; margin:0; }
  .h1.big{ font-size:clamp(76px,7.4cqw,148px); line-height:1.08; }
  .h2{ font-size:clamp(50px,3.5cqw,68px); font-weight:900; line-height:1.3; margin:0; letter-spacing:-0.01em; }
  .h3{ font-size:clamp(36px,2.5cqw,48px); font-weight:700; line-height:1.4; margin:0; }
  .body{ font-size:clamp(32px,2.25cqw,44px); font-weight:400; line-height:1.45; margin:0; }
  .body.md{ font-weight:500; }
  .cap{ font-size:clamp(22px,1.4cqw,28px); font-weight:500; line-height:1.4; color:var(--secondary); }
  .sub{ color:var(--text-sub); }
  .inv .sub{ color:#CFC6DD; }
  .inv .cap{ color:#B8AFCB; }

  /* 히어로 */
  .hero{ flex:1; min-height:0; display:flex; flex-direction:column; justify-content:center; max-width:90%; gap:3.4cqh; }
  .hero .lead{ font-size:clamp(38px,2.9cqw,58px); font-weight:500; line-height:1.5; margin:0; max-width:90%; }

  /* 디테일: 타이틀 밴드 + 본문 */
  .band{ background:var(--band); margin:0 -5.5cqw 2.4cqh; padding:1.4cqh 5.5cqw; flex-shrink:0; }
  .inv .band{ background:#3F3860; }
  .detail-body{ flex:1; min-height:0; overflow:visible; }
  .fit{ transform-origin:top left; height:100%; }

  .prose{ display:flex; flex-direction:column; gap:3.2cqh; max-width:98%; }
  .prose .h3{ margin-bottom:1.2cqh; }
  .prose p{ margin:0; }

  .split{ display:grid; grid-template-columns:1.05fr 1fr; gap:4.5cqw; height:100%; align-items:stretch; }
  .split.wide{ grid-template-columns:0.8fr 1.2fr; }

  /* 회로 트레이스 목록 */
  .trace{ position:relative; display:flex; flex-direction:column; gap:3.2cqh; padding-left:5.2cqw; }
  .trace::before{ content:''; position:absolute; left:1.1cqw; top:1.2cqh; bottom:1.2cqh; width:2px; background:var(--primary); }
  .inv .trace::before{ background:var(--base); }
  .trace .item{ position:relative; }
  .trace .item::before{ content:''; position:absolute; left:calc(-5.2cqw + 1.1cqw); top:1.25cqh; width:1.6cqw; height:2px; background:var(--primary); }
  .inv .trace .item::before{ background:var(--base); }
  .trace .n{ position:absolute; left:calc(-5.2cqw + 2.9cqw); top:-0.2cqh; font-size:clamp(28px,1.8cqw,36px); font-weight:900; color:var(--primary); line-height:1.4; }
  .inv .trace .n{ color:var(--base); }
  .trace .item .h3{ margin-bottom:1cqh; }
  .trace.plain .item::before, .trace.plain::before{ display:none; }

  /* 키-값 표 */
  .kv{ display:flex; flex-direction:column; }
  .kv .row{ display:grid; grid-template-columns:21% 1fr; gap:2cqw; padding:2cqh 0; border-top:1px solid var(--line); }
  .kv .row:last-child{ border-bottom:1px solid var(--line); }
  .kv .k{ font-weight:700; }
  .kv .v{ color:var(--text-sub); }

  /* 표 */
  table.tb{ width:100%; border-collapse:collapse; }
  .tb th{ text-align:left; font-weight:500; color:var(--secondary); padding:1.4cqh 0.8cqw; border-bottom:2px solid var(--primary); font-size:clamp(24px,1.55cqw,30px); }
  .tb td{ padding:1.6cqh 0.8cqw; border-bottom:1px solid var(--line); vertical-align:top; }
  .tb td.k{ font-weight:700; }
  .tb td.s{ color:var(--text-sub); }

  /* 프로토타입 그림 */
  .figure{ height:100%; display:flex; flex-direction:column; gap:1.6cqh; min-height:0; }
  .figure .frame{ flex:1; min-height:0; border:1px solid var(--line); background:#F5F2ED; display:flex; align-items:center; justify-content:center; overflow:hidden; position:relative; }
  .figure img{ max-width:100%; max-height:100%; object-fit:contain; display:block; cursor:zoom-in; }
  .figure .ph{ position:absolute; inset:0; display:none; align-items:center; justify-content:center; flex-direction:column; gap:1cqh; text-align:center; padding:2cqw; color:var(--secondary); }
  .figure.missing .ph{ display:flex; }
  .figure.missing img{ display:none; }

  .figure.mock .frame{ background:transparent; border:0; }
  .phone{ width:390px; height:844px; border:1px solid var(--primary); background:#fff; overflow:hidden; transform-origin:top left; position:absolute; top:0; left:0; }
  .phone iframe{ width:390px; height:844px; border:0; display:block; pointer-events:none; }

  /* 구조도 */
  .struct{ height:100%; display:flex; align-items:center; justify-content:center; }
  .struct svg{ height:100%; width:auto; max-width:100%; }

  /* 하단: 섹션 컨텍스트 + 인디케이터 */
  .foot{ position:absolute; left:5.5cqw; right:5.5cqw; bottom:2.6cqh; display:flex; align-items:center; justify-content:space-between; pointer-events:none; }
  .ctx{ font-size:clamp(22px,1.4cqw,28px); font-weight:500; color:var(--secondary); opacity:.85; }
  .pills{ display:flex; gap:0.5cqw; align-items:center; }
  .pill{ height:6px; width:1.6cqw; background:var(--secondary); opacity:.35; transition:width .35s ease, opacity .35s ease, background .35s ease; }
  .pill.on{ width:4.2cqw; opacity:1; background:var(--primary); }
  .inv .pill.on{ background:var(--base); }
  .count{ font-size:clamp(22px,1.4cqw,28px); font-weight:500; color:var(--secondary); margin-left:1.2cqw; min-width:5cqw; text-align:right; }

  #zoom{ position:fixed; inset:0; background:rgba(33,29,43,.9); display:none; align-items:center; justify-content:center; z-index:99; cursor:zoom-out; }
  #zoom.show{ display:flex; }
  #zoom img{ max-width:94vw; max-height:94vh; }
  ::selection{ background:var(--accent); color:#fff; }
</style>
</head>
<body>
<div id="stage">
  <div id="deck"></div>
</div>
<div id="zoom"><img id="zoomImg" alt=""></div>

<script>
/* ============================================================
   콘텐츠 — 문구 수정은 여기서만. 레이아웃은 아래 렌더러.
   img: 는 img/ 폴더의 목업 PNG 경로. 파일이 없으면 자리표시로 대체됨.
   ============================================================ */
const FILTERS = ['데이터를 스스로 만들 수 있는가', '역할을 나눠도 굴러가는가', '프론트와 백엔드가 실질적으로 분리되는가', '민감정보·위치추적을 다루지 않는가'];

const TOPICS = [
{
  key:'yuga', name:'유가이력', ctx:'유가이력',
  tag:'늘 가는 주유소, 오늘이 평소보다 싼가',
  oneLine:'개별 주유소의 가격 이력을 쌓아 이동평균 대비 오늘 가격을 보여준다',
  criteria:'(c) 개인이 느끼는 불편 해결', ext:'오피넷 일반 API',
  bg:{
    hero:'주유소 가격 비교에는<br>시간축이 없다',
    why:'오피넷과 민간 앱은 "지금 어느 주유소가 싼가"만 보여준다. 늘 가는 주유소 하나를 두고 "오늘이 평소보다 싼가"를 판단할 근거가 없다. 오피넷은 각각의 주유소 추이 데이터를 보여주지 않는다.',
    diff:'오피넷은 지역·전국·정유사 단위 추이, 내비게이션과 주유 앱은 반경 내 현재가 최저 정렬 — 전부 공간축 비교다. 유가이력은 같은 주유소의 시간축 비교이고, 주식 차트의 이동평균선 방식으로 오늘 가격의 위치를 읽는다.'
  },
  gist:{
    hero:'그 주유소의 어제를<br>우리가 쌓는다',
    points:[
      ['하루 1회, 우리가 직접 수집한다','학교 반경 내 주유소 가격을 매일 저장한다. 오피넷은 현재가만 주므로 개별 주유소의 이력은 우리 DB에 쌓이는 데이터가 된다.'],
      ['판단은 사용자, 시스템은 위치만','그래프와 한 줄 텍스트 — "오늘 1,652원, 7일 평균 대비 -23원". 사라고 말하지 않고 평균선 대비 위치만 보여준다.'],
      ['GPS 없이, 반경 고정 풀로','위치정보를 다루지 않는다. 수집 대상이 고정이라 API 호출도 하루 2~6콜, 300콜 한도 대비 여유가 크다.']
    ]
  },
  biz:{
    hero:'무료로 시작하고,<br>제휴 트랙으로 넓힌다',
    rows:[
      ['대상 고객','고정 생활권에서 반복 주유하는 통근·통학 운전자'],
      ['현재 방식','오피넷 현재가 비교, 내비게이션 최저가 안내 — 모두 "지금" 기준'],
      ['지불 근거','1차는 일반 API로 무료. 상용화는 오피넷 창업기업 제휴 트랙(프리미엄 API 무료 제휴, 17개사 이용 중)으로 전국 확장. 수익은 협약 하의 광고, 사전 협의와 출처 명시가 조건'],
      ['제공 형태','모바일 웹']
    ]
  },
  protos:[
    {hero:'오늘 가장 싼 곳부터 보인다', title:'메인 리스트', img:'img/yuga-main.png',
     desc:['학교 반경 내 주유소를 오늘 가격이 낮은 순으로 나열한다. 항목마다 주유소 이름, 브랜드, 오늘 가격을 표시한다.','지도는 두지 않는다. 반경이 고정된 풀이라 "내 주변"이 아니라 "이 목록"이 기준이다.']},
    {hero:'자주 가는 곳만 따로 본다', title:'즐겨찾기 드로어', img:'img/yuga-fav.png',
     desc:['메뉴 버튼으로 우측 드로어를 연다. 즐겨찾기한 주유소만 최저가순으로 나열된다.','늘 가는 주유소 두세 곳을 비교하는 게 이 서비스의 주 사용 장면이다.']},
    {hero:'평균선 아래인지 한 줄로 답한다', title:'상세 · 가격 차트', img:'img/yuga-detail.png',

  ],
  struct:{
    hero:'외부 의존은<br>수집 한 곳에 격리한다',
    screens:[['상세·차트 화면','유종·기간·평균선 토글'],['목록·드로어 화면','최저가순, 즐겨찾기']],
    side:['카카오맵','상세 화면 위치 표시'],
    domains:[['이력·통계','기간 조회, 이동평균 산출'],['주유소·즐겨찾기','주유소 마스터, 회원'],['수집 배치','하루 1회, KATEC 변환']],
    db:'DB · 가격 이력 축적',
    ext:[[2,'오피넷 일반 API','300콜/일, 현재가만']],
    note:'화살표는 주된 호출 관계 하나씩만 표시한다.'
  },
  stack:{
    hero:'React · Spring Boot에<br>배치 하나가 더해질 뿐',
    rows:[

      ['가격 수집 배치','Spring Scheduler + 오피넷 일반 API'],
      ['좌표 변환','WGS84 → KATEC 변환'],
      ['이력·통계 API','Spring Boot 3 + Spring Data JPA'],
      ['인증·즐겨찾기','Spring Security + JWT'],
      ['지도','카카오맵 JavaScript API'],
      ['데이터베이스','PostgreSQL']
    ]
  }
},
{
  key:'book', name:'책바퀴', ctx:'책바퀴',
  tag:'전공 교재는 과목으로 찾는다',
  oneLine:'학과·과목·교수로 검색하는 캠퍼스 중고 교재 장터',
  criteria:'(b) 기존의 불편한 점 개선', ext:'네이버 책 검색 API, 학교 이메일',
  bg:{
    hero:'전공 교재는 제목이 아니라<br>과목으로 찾는다',
    why:'에브리타임 중고장터에는 책과 학과에 특화된 검색 필터가 없다. 글쓴이가 과목명을 적지 않으면 찾을 수 없고, 판매완료 글은 흐름에서 사라져 시세를 참고할 수 없다. 같은 학과 안에서 매 학기 같은 책이 돌아다니는데 이어 주는 구조가 없다.',
    diff:'게시판형 장터와 학술 선례가 있어 시장 자체는 새롭지 않다. 책바퀴는 학과–과목–교수 매핑으로 검색 구조를 바꾸고, 판매완료 이력을 남겨 시세와 관심 알림의 재료로 쓴다.'
  },
  gist:{
    hero:'학과·과목·교수로<br>이어 붙인다',
    points:[

      ['ISBN 하나로 등록이 끝난다','네이버 책 검색 API로 제목·저자를 채우고, 실물 사진과 상태 3단계로 사용감을 보인다.'],
      ['판매완료를 지우지 않는다','완료 매물은 목록에서 숨기되 이력은 보존한다. 시세 조회와 조건 단위 관심교재 알림이 여기서 나온다.']
    ]
  },
  biz:{
    hero:'학과 단위로 시작하는<br>캠퍼스 장터',
    rows:[
      ['대상 고객','학과 단위로 롤아웃하는 대학 — 우리 학과에서 시작'],
      ['현재 방식','에브리타임 게시판, 당근, 학과 단체 채팅'],
      ['지불 근거','결제 미개입, 수수료 없음. 수익화는 광고가 기본, 가능하다면 학교 근처 매장 제휴도'],
      ['제공 형태','학교 이메일 인증 기반 폐쇄형 모바일 웹']
    ]
  },
  protos:[
    {hero:'내 학과 교재가 먼저 보인다', title:'메인 · 검색', img:'img/book-main.png',
     desc:['최상단 검색창. 회원가입 때 지정한 학과의 매물이 기본으로 노출되고, 각 매물에 판매중·예약중·판매완료 상태가 보인다.','학과는 선택 상자, 과목명과 교수는 자동완성 입력이다.']},
    {hero:'상태와 온도까지 보고 채팅으로', title:'매물 상세', img:'img/book-detail.png',

/* ============================================================
   렌더러
   ============================================================ */
const esc = s => s;
function slide(html, opts={}){ return Object.assign({html}, opts); }

function heroSlide(title, lead, ctx, inv=false){
  return slide(`<div class="hero"><h1 class="h1">${title}</h1>${lead?`<p class="lead sub">${lead}</p>`:''}</div>`, {ctx, inv});
}
function detailSlide(h2, inner, ctx){
  return slide(`<div class="band"><h2 class="h2">${h2}</h2></div><div class="detail-body"><div class="fit">${inner}</div></div>`, {ctx});
}

function proseBlock(items){
  return `<div class="prose">${items.map(([h,p])=>`<div><h3 class="h3">${h}</h3><p class="body sub">${p}</p></div>`).join('')}</div>`;
}
function traceList(points, numbered=false){
  return `<div class="trace${numbered?'':' plain'}">${points.map(([h,p],i)=>`<div class="item">${numbered?`<span class="n">${i+1}</span>`:''}<h3 class="h3">${h}</h3><p class="body sub">${p}</p></div>`).join('')}</div>`;
}
function kvTable(rows){
  return `<div class="kv">${rows.map(([k,v])=>`<div class="row"><div class="k body">${k}</div><div class="v body">${v}</div></div>`).join('')}</div>`;
}
function figure(img, caption){
  const id = 'f'+Math.random().toString(36).slice(2,8);
  if(MOCKS[img]){
    const doc = MOCKS[img]().replace(/"/g,'&quot;');
    return `<div class="figure mock" id="${id}"><div class="frame"><div class="phone"><iframe srcdoc="${doc}" title="${caption}" scrolling="no"></iframe></div></div><div class="cap">${caption} — 화면 목업</div></div>`;
  }
  return `<div class="figure" id="${id}"><div class="frame"><img src="${img}" alt="${caption}" onerror="document.getElementById('${id}').classList.add('missing')"><div class="ph"><span class="body md">${caption}</span><span class="cap">목업 이미지 자리 — ${img}</span></div></div><div class="cap">${caption}</div></div>`;
}

/* 구조도 SVG — 세 주제 공통 배치: 왼쪽 화면군, 가운데 도메인+DB, 오른쪽 외부 의존 */
function structSvg(c){
  const W=1300,H=620, rowY=[96,220,344], rh=100, dbY=486, dbH=80;
  const L={x:20,w:370}, C={x:450,w:440}, R={x:950,w:330};
  const P='#332C4A', S='#9C8B72', B='#EDE9E3';
  const f=31, fs=25;
  // 글자폭 추정: 한글·전각 1.0em, 라틴·숫자·기호 0.58em — 박스 폭을 넘으면 폰트를 줄인다
  const tw=(t,px)=>[...t].reduce((a,ch)=>a+(/[\u3131-\uD79D\u4E00-\u9FFF\uFF00-\uFFEF]/.test(ch)?1:0.58)*px,0);
  const fit=(t,px,maxW)=>{ let z=px; while(z>14 && tw(t,z)>maxW) z-=1; return z; };
  let o='';
  const box=(x,y,w,h,t,sub,fill,stroke,tc,sc)=>{
    o+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" fill="${fill}" stroke="${stroke}" stroke-width="1.5"/>`;
    const cy=y+h/2, inner=w-28;
    if(sub){
      const f1=fit(t,f,inner), f2=fit(sub,fs,inner);
      o+=`<text x="${x+w/2}" y="${cy-13}" text-anchor="middle" font-size="${f1}" font-weight="700" fill="${tc}">${t}</text>`;
      o+=`<text x="${x+w/2}" y="${cy+22}" text-anchor="middle" font-size="${f2}" font-weight="400" fill="${sc}">${sub}</text>`;
    } else {
      const f1=fit(t,f,inner);
      o+=`<text x="${x+w/2}" y="${cy}" text-anchor="middle" font-size="${f1}" font-weight="700" fill="${tc}" dominant-baseline="central">${t}</text>`;
    }
  };
  const lab=(x,t)=>{ o+=`<text x="${x}" y="52" font-size="${fs}" font-weight="500" fill="${S}">${t}</text>`; };
  const tick=(x,y,vert)=> o+= vert? `<line x1="${x-8}" y1="${y}" x2="${x+8}" y2="${y}" stroke="${P}" stroke-width="3"/>` : `<line x1="${x}" y1="${y-8}" x2="${x}" y2="${y+8}" stroke="${P}" stroke-width="3"/>`;
  const hline=(x1,x2,y)=>{ o+=`<line x1="${x1}" y1="${y}" x2="${x2}" y2="${y}" stroke="${P}" stroke-width="1.5"/>`; tick(x1,y,false); tick(x2,y,false); };
  const vline=(x,y1,y2)=>{ o+=`<line x1="${x}" y1="${y1}" x2="${x}" y2="${y2}" stroke="${P}" stroke-width="1.5"/>`; tick(x,y1,true); tick(x,y2,true); };

  lab(L.x,'화면군'); lab(C.x,'도메인'); lab(R.x,'외부 의존');
  c.screens.forEach((sc,i)=> box(L.x,rowY[i],L.w,rh,sc[0],sc[1],'none',P,P,'#4E4760'));
  box(L.x,rowY[2],L.w,rh,c.side[0],c.side[1],'none',S,'#5F5545',S);
  c.domains.forEach((d,i)=> box(C.x,rowY[i],C.w,rh,d[0],d[1],P,P,B,'#CFC6DD'));
  box(C.x,dbY,C.w,dbH,c.db,null,S,S,'#FBF8F3',null);
  c.ext.forEach(([row,t,sub])=> box(R.x,rowY[row],R.w,rh,t,sub,'none',S,'#5F5545',S));
  hline(L.x+L.w, C.x, rowY[0]+rh/2);
  hline(L.x+L.w, C.x, rowY[1]+rh/2);
  c.ext.forEach(([row])=> hline(C.x+C.w, R.x, rowY[row]+rh/2));
  vline(C.x+C.w/2, rowY[2]+rh, dbY);
  return `<svg viewBox="0 0 ${W} ${H}" xmlns="http://www.w3.org/2000/svg" font-family="'Noto Sans KR', sans-serif">${o}</svg>`;
}

function buildTopic(t, idx){
  const out=[];
  const n = idx+1;
  // 섹션 디바이더 (배경 반전)
  out.push(slide(`<div class="hero"><h1 class="h1 big">${t.name}</h1><p class="lead sub">${t.tag}</p></div>`, {ctx:`주제 ${n}`, inv:true, group:t.key}));
  // 01 배경
  out.push(heroSlide(t.bg.hero, null, `${t.ctx} — 배경`));
  out.push(detailSlide('왜 필요한가', proseBlock([['문제',t.bg.why],['기존 사례와의 차이',t.bg.diff]]), `${t.ctx} — 배경`));
  // 02 요지
  out.push(heroSlide(t.gist.hero, null, `${t.ctx} — 아이디어 요지`));
  out.push(detailSlide('주요 포인트', traceList(t.gist.points), `${t.ctx} — 아이디어 요지`));
  // 03 상용화
  out.push(heroSlide(t.biz.hero, null, `${t.ctx} — 상용화 가능성`));
  out.push(detailSlide('판매 구조', kvTable(t.biz.rows), `${t.ctx} — 상용화 가능성`));
  // 프로토타입
  t.protos.forEach(p=>{
    out.push(heroSlide(p.hero, null, `${t.ctx} — 프로토타입 · ${p.title}`));
    out.push(detailSlide(`화면 설명 — ${p.title}`, `<div class="split wide">${figure(p.img, p.title)}<div class="prose">${p.desc.map(d=>`<p class="body sub">${d}</p>`).join('')}</div></div>`, `${t.ctx} — 프로토타입 · ${p.title}`));
  });
  // 09 기능 구조
  out.push(heroSlide(t.struct.hero, null, `${t.ctx} — 기능 구조`));
  out.push(detailSlide('기능 구조', `<div class="struct">${structSvg(t.struct)}</div><p class="cap" style="margin-top:1cqh">${t.struct.note}</p>`, `${t.ctx} — 기능 구조`));
  // 10 개발환경
  out.push(heroSlide(t.stack.hero, null, `${t.ctx} — 개발환경 및 도구`));
  out.push(detailSlide('기술 스택', `<table class="tb body"><thead><tr><th>담당 영역</th><th>사용 기술</th></tr></thead><tbody>${t.stack.rows.map(([a,b])=>`<tr><td class="k">${a}</td><td class="s">${b}</td></tr>`).join('')}</tbody></table>`, `${t.ctx} — 개발환경 및 도구`));
  out.forEach(s=>{ s.group=t.key; });
  return out;
}

const SLIDES = [];
// 표지
SLIDES.push(slide(`<div class="hero"><h1 class="h1">캡스톤디자인<br>주제 제안</h1><p class="lead sub">유가이력 · 책바퀴 · 잇썸 — 세 가지 후보</p><p class="cap">React · Spring Boot 기반 서비스 · 2026.09 – 2027.03</p></div>`, {ctx:'', group:'intro'}));
// 3주제 한눈에
SLIDES.push(detailSlide('세 후보 한눈에', `<table class="tb body"><thead><tr><th style="width:14%">주제</th><th>한 줄 요지</th><th style="width:22%">교수님 기준</th><th style="width:22%">핵심 외부 의존</th></tr></thead><tbody>${TOPICS.map(t=>`<tr><td class="k">${t.name}</td><td class="s">${t.oneLine}</td><td class="s">${t.criteria}</td><td class="s">${t.ext}</td></tr>`).join('')}</tbody></table>`, '세 후보 한눈에'));
SLIDES[SLIDES.length-1].group='intro';

TOPICS.forEach((t,i)=> SLIDES.push(...buildTopic(t,i)));

// 공통 기술 기반
SLIDES.push(heroSlide('어느 주제가 되어도<br>같은 기반 위에서 시작한다', '세 후보 모두 React · Spring Boot 3 · JPA · PostgreSQL · Spring Security · 카카오맵. 주제가 바뀌어도 팀의 학습 곡선은 같다.', '공통 기술 기반', false));
SLIDES[SLIDES.length-1].group='outro';
SLIDES.push(slide(`<div class="hero"><h1 class="h1 big">감사합니다</h1><p class="lead sub">질문을 받겠습니다</p></div>`, {ctx:'', inv:true, group:'outro'}));

/* ---------- DOM ---------- */
const GROUPS = ['intro', ...TOPICS.map(t=>t.key), 'outro'];
const deck = document.getElementById('deck');
SLIDES.forEach((s,i)=>{
  const el=document.createElement('div');
  el.className='slide'+(s.inv?' inv':'');
  el.dataset.index=i;
  el.innerHTML = s.html + `<div class="foot"><div class="ctx">${s.ctx||''}</div><div class="pills">${GROUPS.map(g=>`<span class="pill${g===s.group?' on':''}"></span>`).join('')}<span class="count">${String(i+1).padStart(2,'0')} / ${String(SLIDES.length).padStart(2,'0')}</span></div></div>`;
  deck.appendChild(el);
});

function fitPhones(a){
  a.querySelectorAll('.figure.mock .frame').forEach(fr=>{
    const ph=fr.querySelector('.phone'); if(!ph) return;
    const sc=Math.min(fr.clientHeight/844, fr.clientWidth/390);
    ph.style.transform='scale('+sc+')';
    ph.style.left=((fr.clientWidth-390*sc)/2)+'px';
  });
}
function autofit(){
  const a=document.querySelector('.slide.active'); if(!a) return;
  fitPhones(a);
  const fit=a.querySelector('.fit'); if(!fit) return;
  const box=fit.parentElement;
  fit.style.width=''; fit.style.transform='';
  const availH=box.clientHeight, need=fit.scrollHeight;
  if(need>availH && need>0){
    const sc=Math.max(availH/need,0.6);
    fit.style.width=(100/sc)+'%'; fit.style.transform='scale('+sc+')';
  }
}
let cur=0;
const list=()=>Array.from(document.querySelectorAll('.slide'));
function go(i){
  const l=list(); if(i<0||i>=l.length) return;
  l.forEach((el,k)=>{ el.classList.remove('active','prev'); if(k===i) el.classList.add('active'); else if(k<i) el.classList.add('prev'); });
  cur=i; location.hash='#'+(i+1);
  requestAnimationFrame(autofit);
}
document.addEventListener('keydown',e=>{
  if(['ArrowDown','ArrowRight',' ','PageDown'].includes(e.key)){ e.preventDefault(); go(cur+1); }
  else if(['ArrowUp','ArrowLeft','PageUp'].includes(e.key)){ e.preventDefault(); go(cur-1); }
  else if(e.key==='Home') go(0); else if(e.key==='End') go(list().length-1);
  else if(e.key==='Escape') zoom.classList.remove('show');
});
let ty=null;
document.addEventListener('touchstart',e=>ty=e.touches[0].clientY);
document.addEventListener('touchend',e=>{ if(ty===null) return; const dy=e.changedTouches[0].clientY-ty; if(dy<-40) go(cur+1); else if(dy>40) go(cur-1); ty=null; });
const zoom=document.getElementById('zoom'), zoomImg=document.getElementById('zoomImg');
document.addEventListener('wheel',e=>{ if(zoom.classList.contains('show')) return; if(Math.abs(e.deltaY)<12) return; go(e.deltaY>0?cur+1:cur-1); },{passive:true});
document.addEventListener('click',e=>{
  const img=e.target.closest('.figure img');
  if(img){ zoomImg.src=img.src; zoom.classList.add('show'); return; }
  if(zoom.classList.contains('show')){ zoom.classList.remove('show'); return; }
  if(e.clientY>window.innerHeight*0.75) go(cur+1);
});
window.addEventListener('resize',autofit);
const start=Math.max(0,Math.min(list().length-1,(parseInt(location.hash.slice(1))||1)-1));
go(start);
if(document.fonts&&document.fonts.ready) document.fonts.ready.then(autofit);
window.addEventListener('load',autofit);
setTimeout(autofit,600);
</script>
